name: notevault-release

# Team Tha-Khit-Ok release build for NoteVault (project/starter-app).
# Builds the container image on GitHub's hosted runner, generates a CycloneDX
# SBOM, and has GitHub sign SLSA build provenance for both files (artifact
# attestations, Sigstore keyless signing). Runs only on main, so every
# attestation belongs to code that went through a pull request.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write      # OIDC token for keyless signing
  attestations: write  # store the attestation on the repository

env:
  APP_DIR: project/starter-app

jobs:
  build-attest:
    name: Build, SBOM and provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build image
        run: |
          docker build -t "notevault:$GITHUB_SHA" "$APP_DIR"
          docker save "notevault:$GITHUB_SHA" -o notevault-image.tar
      - name: Generate SBOM (CycloneDX)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/syft:v1.55.0 "notevault:$GITHUB_SHA" -o cyclonedx-json > sbom.cdx.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            notevault-image.tar
            sbom.cdx.json
      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: notevault-release-${{ github.sha }}
          path: |
            notevault-image.tar
            sbom.cdx.json
          retention-days: 14
